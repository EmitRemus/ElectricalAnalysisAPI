  <script>
    (() => {
      const root = document.getElementById("electrical-api-verification");
      const select = root.querySelector("select");
      const summary = root.querySelector("[data-verification-summary]");
      const list = root.querySelector("[data-verification-list]");
      const heatmap = root.querySelector("[data-verification-heatmap]");
      const groups = JSON.parse(root.querySelector("[data-verification-data]").textContent);
      const matches = (expected, actual, digits) => {
        if (Array.isArray(expected)) {
          return Array.isArray(actual) && expected.length === actual.length &&
            expected.every((value, index) => matches(value, actual[index], digits));
        }
        if (typeof expected === "number" && digits !== undefined) {
          return Number.isFinite(actual) && Math.abs(expected - actual) < 0.5 * 10 ** -digits;
        }
        return expected === actual;
      };
      const passed = check => check.expectedStatus === check.status &&
        check.metrics.every(({ expected, actual, digits }) => matches(expected, actual, digits));
      const format = (value, digits) => {
        if (Array.isArray(value)) return value.map(item => format(item, digits)).join(" · ");
        if (typeof value === "boolean") return value ? "так" : "ні";
        if (typeof value !== "number") return value ?? "—";
        return new Intl.NumberFormat("uk-UA", {
          minimumFractionDigits: digits ?? 0,
          maximumFractionDigits: digits ?? 0,
        }).format(value);
      };
      const element = (tag, content, className) => {
        const node = document.createElement(tag);
        if (content !== undefined) node.textContent = content;
        if (className) node.className = className;
        return node;
      };
      const render = group => {
        select.value = Object.hasOwn(groups, group) ? group : "readings";
        heatmap.hidden = select.value !== "readings";
        list.replaceChildren(...groups[select.value].flatMap(check => {
          const details = element("details");
          const header = element("summary", check.name, "cursor-interaction");
          const result = passed(check) ? `HTTP ${check.status} · Збіг` : `HTTP ${check.status} · Розбіжність`;
          header.append(element("span", result, "viz-badge tabular-nums"));
          const evidence = element("div", undefined, "verification-evidence");
          evidence.append(element("code", check.request));
          const metrics = element("ul", undefined, "tabular-nums");
          metrics.append(element("li", `HTTP-статус — очікували ${check.expectedStatus}, отримали ${check.status}`));
          for (const { label, expected, actual, digits, unit = "" } of check.metrics) {
            metrics.append(element("li", `${label} — очікували ${format(expected, digits)}${unit}, отримали ${format(actual, digits)}${unit}`));
          }
          evidence.append(metrics);
          details.append(header, evidence);
          return [details, element("hr")];
        }));
      };
      const checks = Object.values(groups).flat();
      summary.textContent = `${checks.filter(passed).length} із ${checks.length} контрольних сценаріїв пройдено`;
      render(window.openai?.widgetState?.modelContent?.section);
      select.addEventListener("change", () => {
        render(select.value);
        window.openai?.setWidgetState?.({ modelContent: { section: select.value } })?.catch(() => {});
      });
      window.addEventListener("openai:set_globals", event => {
        const state = event.detail?.globals?.widgetState;
        if (state !== undefined) render(state?.modelContent?.section);
      });
    })();
  </script>

    import { mountChart } from "https://persistent.oaistatic.com/plugins/visualize/charts/1.2.3/element.js";

    const root = document.getElementById("electrical-api-meter-priority");
    const disclosure = root.closest("details");
    const renderChart = () => {
      if (!disclosure.open) return;
      const config = JSON.parse(root.querySelector("[data-viz-chart]").textContent);
      mountChart(root.querySelector("[data-viz-container]"), config);
      disclosure.removeEventListener("toggle", renderChart);
    };
    disclosure.addEventListener("toggle", renderChart);
    renderChart();
